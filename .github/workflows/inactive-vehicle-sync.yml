name: Avtomol remove inactive vehicles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safety mode
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      channel:
        description: Channel to synchronize
        required: true
        type: choice
        default: all
        options:
          - all
          - shopify
          - facebook
          - olx

permissions:
  contents: read

concurrency:
  group: avtomol-inactive-vehicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      OLX_ACCESS_TOKEN: ${{ secrets.OLX_ACCESS_TOKEN }}
      SYNC_MODE: ${{ inputs.mode }}
      SYNC_CHANNEL: ${{ inputs.channel }}
      INACTIVE_PLAN_PATH: data/inactive-vehicle-sync.json
      INACTIVE_REPORT_PATH: inactive-vehicle-sync-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and synchronize inactive vehicles
        run: node scripts/sync-inactive-vehicles.js
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inactive-vehicle-sync-${{ inputs.mode }}-${{ inputs.channel }}
          path: inactive-vehicle-sync-report.json
          retention-days: 30
          if-no-files-found: warn
