name: Avtomol daily vehicle sync

on:
  schedule:
    # Both UTC equivalents of 21:00 Europe/Sofia; the guard handles DST.
    - cron: '0 18,19 * * *'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Изпълни реални промени'
        required: true
        type: boolean
        default: false

concurrency:
  group: avtomol-daily-vehicle-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      INVENTORY_FEED_URL: ${{ secrets.INVENTORY_FEED_URL }}
      INVENTORY_FEED_TOKEN: ${{ secrets.INVENTORY_FEED_TOKEN }}
      # A schedule may apply changes only when the verified full AUTO1 feed is
      # actually configured. Without it the run remains an honest audit.
      SYNC_DRY_RUN: ${{ github.event_name == 'schedule' && secrets.INVENTORY_FEED_URL != '' && 'false' || github.event_name == 'workflow_dispatch' && inputs.apply_changes == true && 'false' || 'true' }}
      MAX_DELETIONS_PER_RUN: ${{ vars.MAX_DELETIONS_PER_RUN || '20' }}
      MIN_INVENTORY_COUNT: ${{ secrets.INVENTORY_FEED_URL != '' && '25000' || '1' }}
      AUTO1_REQUIRED_CATALOG_SIZE: '25000'
      ALLOW_DELETIONS: 'false'
      # Real daily mode: keep existing URLs, update matching stock records and
      # add newly eligible vehicles. Missing vehicles are never deleted here.
      ALLOW_ADDITIONS: 'true'
      ALLOW_UPDATES: 'true'
      FACEBOOK_STRICT: 'false'
      VEHICLE_SYNC_REPORT_PATH: daily-vehicle-sync-report.json
      VEHICLE_KNOWLEDGE_PATH: vehicle-knowledge.json
    steps:
      - name: Select the correct 21:00 Sofia schedule
        id: sofia_time
        shell: bash
        run: |
          # GitHub exposes the combined cron expression ("0 18,19 * * *")
          # for both invocations, so comparing it to a single-hour expression
          # always skipped the real 21:00 Sofia run while still reporting a
          # green workflow. Select by the actual Sofia local hour instead.
          SOFIA_HOUR="$(TZ=Europe/Sofia date +%H)"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$SOFIA_HOUR" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC invocation; Sofia local hour is ${SOFIA_HOUR}."
          fi
      - uses: actions/checkout@v7
        if: steps.sofia_time.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.sofia_time.outputs.run == 'true'
        with:
          node-version: '22'
      - if: steps.sofia_time.outputs.run == 'true'
        run: npm install --ignore-scripts --no-package-lock
      - name: Synchronize Avtomol.com and Facebook
        if: steps.sofia_time.outputs.run == 'true'
        run: npm run sync:vehicles
      - name: Upload synchronization report
        if: always() && steps.sofia_time.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-vehicle-sync-report
          path: |
            daily-vehicle-sync-report.json
            vehicle-knowledge.json
          retention-days: 14
          if-no-files-found: warn

