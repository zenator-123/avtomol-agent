name: Avtomol daily vehicle sync

on:
  schedule:
    # Both UTC equivalents of 21:00 Europe/Sofia; the guard handles DST.
    - cron: '0 18,19 * * *'
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'Изпълни реални промени'
        required: true
        type: boolean
        default: false

concurrency:
  group: avtomol-daily-vehicle-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      INVENTORY_FEED_URL: ${{ secrets.INVENTORY_FEED_URL }}
      INVENTORY_FEED_TOKEN: ${{ secrets.INVENTORY_FEED_TOKEN }}
      SYNC_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'workflow_dispatch' && inputs.apply_changes == true && 'false' || 'true' }}
      MAX_DELETIONS_PER_RUN: ${{ vars.MAX_DELETIONS_PER_RUN || '20' }}
      MIN_INVENTORY_COUNT: '25000'
      AUTO1_REQUIRED_CATALOG_SIZE: '25000'
      ALLOW_DELETIONS: 'false'
      ALLOW_ADDITIONS: 'false'
      ALLOW_UPDATES: 'false'
      FACEBOOK_STRICT: 'true'
      VEHICLE_SYNC_REPORT_PATH: daily-vehicle-sync-report.json
      VEHICLE_KNOWLEDGE_PATH: vehicle-knowledge.json
    steps:
      - name: Check that it is 21:00 in Sofia
        id: sofia_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Sofia date +%H)" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule; it is not 21:00 in Sofia."
          fi
      - uses: actions/checkout@v7
        if: steps.sofia_time.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.sofia_time.outputs.run == 'true'
        with:
          node-version: '22'
      - if: steps.sofia_time.outputs.run == 'true'
        run: npm install --ignore-scripts --no-package-lock
      - name: Synchronize Avtomol.com and Facebook
        if: steps.sofia_time.outputs.run == 'true'
        run: npm run sync:vehicles
      - name: Upload synchronization report
        if: always() && steps.sofia_time.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-vehicle-sync-report
          path: |
            daily-vehicle-sync-report.json
            vehicle-knowledge.json
          retention-days: 14
          if-no-files-found: warn

