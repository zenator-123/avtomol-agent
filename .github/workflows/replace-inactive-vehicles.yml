name: Replace inactive Avtomol vehicles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates remote state; apply performs the replacement"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      channel:
        description: "Channel to validate or synchronize"
        required: true
        default: all
        type: choice
        options:
          - all
          - shopify
          - facebook
          - olx
      offset:
        description: "Zero-based replacement offset"
        required: true
        default: "0"
        type: string
      limit:
        description: "Number of replacements; 0 means all remaining"
        required: true
        default: "0"
        type: string
      local_validate_only:
        description: "Decrypt and validate the manifest without contacting channels"
        required: true
        default: false
        type: boolean
      allow_olx_refresh:
        description: "Allow OLX OAuth refresh and create an encrypted token handoff"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: replace-inactive-avtomol-vehicles
  cancel-in-progress: false

jobs:
  replace:
    name: Validate and replace sold vehicle positions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REPLACEMENT_MODE: ${{ inputs.mode }}
      REPLACEMENT_CHANNEL: ${{ inputs.channel }}
      REPLACEMENT_OFFSET: ${{ inputs.offset }}
      REPLACEMENT_LIMIT: ${{ inputs.limit }}
      REPLACEMENT_LOCAL_VALIDATE_ONLY: ${{ inputs.local_validate_only }}
      REPLACEMENT_MANIFEST_PATH: data/replacement-vehicles-2026-07-27.enc.json
      REPLACEMENT_REPORT_PATH: replacement-vehicle-sync-report.json
      REPLACEMENT_MANIFEST_KEY: ${{ secrets.REPLACEMENT_MANIFEST_KEY }}
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      OLX_ACCESS_TOKEN: ${{ secrets.OLX_ACCESS_TOKEN }}
      OLX_REFRESH_TOKEN: ${{ secrets.OLX_REFRESH_TOKEN }}
      OLX_CLIENT_ID: ${{ secrets.OLX_CLIENT_ID }}
      OLX_CLIENT_SECRET: ${{ secrets.OLX_CLIENT_SECRET }}
      OLX_ALLOW_REFRESH: ${{ inputs.allow_olx_refresh }}
      OLX_TOKEN_TRANSFER_KEY: ${{ secrets.OLX_TOKEN_TRANSFER_KEY }}
      OLX_TOKEN_HANDOFF_PATH: ${{ runner.temp }}/olx-refreshed-token.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate or synchronize vehicle positions
        run: node scripts/replace-inactive-vehicles.js

      - name: Encrypt refreshed OLX token
        if: always()
        shell: bash
        run: |
          if [ -f "$OLX_TOKEN_HANDOFF_PATH" ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -in "$OLX_TOKEN_HANDOFF_PATH" \
              -out olx-refreshed-token.enc \
              -pass env:OLX_TOKEN_TRANSFER_KEY
            rm -f "$OLX_TOKEN_HANDOFF_PATH"
          fi

      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replacement-vehicle-sync-${{ github.run_id }}
          path: |
            replacement-vehicle-sync-report.json
            olx-refreshed-token.enc
          if-no-files-found: warn
          retention-days: 30
