name: NIKOLAY daily growth agent

on:
  schedule:
    # Both UTC equivalents of 22:30 Europe/Sofia; the guard handles DST.
    - cron: '30 19,20 * * *'
  workflow_dispatch:
    inputs:
      publish_owned_channels:
        description: 'Публикувай в свързаните собствени канали'
        required: true
        type: boolean
        default: false

concurrency:
  group: nikolay-daily-growth-agent
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  audit-content-and-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GROWTH_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && inputs.publish_owned_channels == true && 'true' || vars.GROWTH_PUBLISH_ENABLED || 'false' }}
      GROWTH_APPLY_SAFE_FIXES: ${{ vars.GROWTH_APPLY_SAFE_FIXES || 'false' }}
      SHOPIFY_AVTOMOL_DOMAIN: ${{ secrets.SHOPIFY_AVTOMOL_DOMAIN || secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_AVTOMOL_ACCESS_TOKEN: ${{ secrets.SHOPIFY_AVTOMOL_ACCESS_TOKEN || secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_AVTOMOL_CLIENT_ID: ${{ secrets.SHOPIFY_AVTOMOL_CLIENT_ID || secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_AVTOMOL_CLIENT_SECRET: ${{ secrets.SHOPIFY_AVTOMOL_CLIENT_SECRET || secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_MEGAMOLL_DOMAIN: ${{ secrets.SHOPIFY_MEGAMOLL_DOMAIN }}
      SHOPIFY_MEGAMOLL_ACCESS_TOKEN: ${{ secrets.SHOPIFY_MEGAMOLL_ACCESS_TOKEN }}
      SHOPIFY_MEGAMOLL_CLIENT_ID: ${{ secrets.SHOPIFY_MEGAMOLL_CLIENT_ID }}
      SHOPIFY_MEGAMOLL_CLIENT_SECRET: ${{ secrets.SHOPIFY_MEGAMOLL_CLIENT_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      FACEBOOK_AVTOMOL_PAGE_ID: ${{ secrets.FACEBOOK_AVTOMOL_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_AVTOMOL_PAGE_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_AVTOMOL_PAGE_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_MEGAMOLL_PAGE_ID: ${{ secrets.FACEBOOK_MEGAMOLL_PAGE_ID }}
      FACEBOOK_MEGAMOLL_PAGE_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_MEGAMOLL_PAGE_TOKEN }}
      FACEBOOK_POSEJDON_PAGE_ID: ${{ secrets.FACEBOOK_POSEJDON_PAGE_ID }}
      FACEBOOK_POSEJDON_PAGE_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_POSEJDON_PAGE_TOKEN }}
      FACEBOOK_WATER_PAGE_ID: ${{ secrets.FACEBOOK_WATER_PAGE_ID }}
      FACEBOOK_WATER_PAGE_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_WATER_PAGE_TOKEN }}
    steps:
      - name: Check that it is 22:00 in Sofia
        id: sofia_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Sofia date +%H)" = "22" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule; it is not 22:00 in Sofia."
          fi
      - uses: actions/checkout@v7
        if: steps.sofia_time.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.sofia_time.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Run NIKOLAY
        if: steps.sofia_time.outputs.run == 'true'
        run: npm run growth:run
      - name: Upload full daily report
        if: always() && steps.sofia_time.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nikolay-daily-report-${{ github.run_number }}
          path: growth-output/
          retention-days: 90
          if-no-files-found: warn
