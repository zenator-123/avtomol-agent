name: OLX activate protected advert

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olx-protected-ad-148564438
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLX_ACCESS_TOKEN: ${{ secrets.OLX_ACCESS_TOKEN }}
      OLX_REFRESH_TOKEN: ${{ secrets.OLX_REFRESH_TOKEN }}
      OLX_CLIENT_ID: ${{ secrets.OLX_CLIENT_ID }}
      OLX_CLIENT_SECRET: ${{ secrets.OLX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Activate and verify protected OLX advert
        run: node scripts/olx-protected-ad.js
