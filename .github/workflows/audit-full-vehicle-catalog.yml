name: Audit full Avtomol vehicle catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-full-avtomol-vehicle-catalog
  cancel-in-progress: false

jobs:
  audit:
    name: Compare current vehicle stocks with Shopify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FULL_CATALOG_AUDIT_MANIFEST_PATH: data/full-catalog-stock-audit.enc.json
      FULL_CATALOG_AUDIT_REPORT_PATH: full-catalog-stock-audit-report.json
      REPLACEMENT_MANIFEST_KEY: ${{ secrets.REPLACEMENT_MANIFEST_KEY }}
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit full vehicle catalog
        run: node scripts/audit-full-vehicle-catalog.js

      - name: Upload full catalog audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-catalog-stock-audit-${{ github.run_id }}
          path: full-catalog-stock-audit-report.json
          if-no-files-found: error
          retention-days: 30
